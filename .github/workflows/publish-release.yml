name: Publish prebuilt Windows release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "release-assets/latest.yml"
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write

jobs:
  publish-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prebuilt artifacts
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MoyuTools $RELEASE_TAG" \
              --generate-notes \
              release-assets/latest.yml \
            "moyuwx-tools-${RELEASE_TAG#v}-setup-x64.exe" \
            "moyuwx-tools-${RELEASE_TAG#v}-portable-x64.exe" \
            "moyuwx-tools-${RELEASE_TAG#v}-setup-x64.exe.blockmap"

  refresh-manifest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release manifest
        uses: actions/checkout@v4

      - name: Replace current release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION=$(sed -n 's/^version: *//p' latest.yml | head -n 1)
          gh release upload "v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release-assets/latest.yml
