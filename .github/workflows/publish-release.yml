name: Publish prebuilt Windows release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "release-assets/latest.yml"
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write

jobs:
  refresh-manifest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release manifest
        uses: actions/checkout@v4

      - name: Replace current release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION=$(sed -n 's/^version: *//p' release-assets/latest.yml | head -n 1)
          gh release upload "v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release-assets/latest.yml
