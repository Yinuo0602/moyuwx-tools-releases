releaseNotes: |
  - 新增全网去水印工具，支持多平台分享链接解析以及视频、图集和 Live Photo 本地保存。
  - 新增微信下载工具，内置两套视频号下载方案，并完善批量分页、当前作品识别和 H.264 兼容转换。
